<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanvas board</title>
<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
header h1 { font-size: 20px; margin: 0; }
header button { margin-left: auto; }
#status { font-size: 14px; min-height: 1.2em; }
#warnings { margin-bottom: 12px; }
#warnings:empty { display: none; }
.banner { border: 1px solid currentColor; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; }
#board { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap: 12px; }
.column[data-column-id="backlog"] { --phase-accent: #64748b; }
.column[data-column-id="sprint"] { --phase-accent: #3b82f6; }
.column[data-column-id="development"] { --phase-accent: #8b5cf6; }
.column[data-column-id="staging"] { --phase-accent: #d97706; }
.column[data-column-id="production"] { --phase-accent: #16a34a; }
.column[data-column-id="abandoned"] { --phase-accent: #dc2626; }
.column { --phase-accent: CanvasText; border: 1px solid CanvasText; border-inline-start: 4px solid CanvasText; background: Canvas; border-radius: 8px; padding: 8px; min-height: 120px; border-color: color-mix(in srgb, var(--phase-accent) 55%, Canvas); border-inline-start-color: var(--phase-accent); background: color-mix(in srgb, var(--phase-accent) 6%, Canvas); }
.column.drop-target { outline: 3px solid Highlight; outline-color: var(--phase-accent); outline-offset: 2px; }
.column h2 { font-size: 14px; margin: 0 0 8px; padding-bottom: 4px; border-bottom: 2px solid CanvasText; border-bottom-color: var(--phase-accent); }
.card { border: 1px solid CanvasText; background: Canvas; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; cursor: grab; width: 100%; text-align: left; font: inherit; border-color: color-mix(in srgb, var(--phase-accent) 40%, Canvas); background: color-mix(in srgb, var(--phase-accent) 10%, Canvas); }
.card:active { cursor: grabbing; }
.card:hover { border-width: 2px; }
.card .slug { font-size: 12px; opacity: 0.75; }
#popup-backdrop { position: fixed; inset: 0; background: CanvasText; background: color-mix(in srgb, CanvasText 45%, Canvas); display: none; align-items: center; justify-content: center; }
#popup-backdrop.open { display: flex; }
#popup { background: Canvas; color: CanvasText; border: 1px solid CanvasText; border-color: color-mix(in srgb, CanvasText 30%, Canvas); border-radius: 10px; padding: 20px; max-width: 560px; width: 90%; max-height: 85vh; overflow: auto; }
#popup h2 { margin-top: 0; font-size: 18px; }
#popup dl { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 14px; }
#popup dt { font-weight: bold; }
#popup dd { margin: 0; overflow-wrap: anywhere; }
#popup .close { float: right; }
#popup .move-row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#popup .spec-row { margin-top: 16px; }
#spec-view { margin-top: 8px; max-height: 40vh; overflow: auto; border: 1px solid CanvasText; border-radius: 6px; padding: 8px 12px; }
#spec-view[hidden] { display: none; }
#spec-view pre { overflow: auto; background: color-mix(in srgb, CanvasText 6%, Canvas); padding: 8px; border-radius: 4px; }
#spec-view pre code { background: transparent; padding: 0; }
#spec-view code { background: color-mix(in srgb, CanvasText 6%, Canvas); padding: 1px 4px; border-radius: 3px; }
#spec-error { font-weight: bold; }
#error { color: inherit; font-weight: bold; }
@media (max-width: 1100px) { #board { grid-template-columns: repeat(3, minmax(180px, 1fr)); } }
@media (max-width: 640px) { #board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
<h1>Kanvas board</h1>
<span id="meta"></span>
<button id="refresh" type="button">Refresh</button>
</header>
<div id="status" role="status" aria-live="polite"></div>
<div id="warnings" role="alert"></div>
<main id="board" aria-live="polite"></main>
<div id="popup-backdrop">
<div id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
<button id="popup-close" class="close" type="button">Close</button>
<h2 id="popup-title"></h2>
<div id="popup-body"></div>
</div>
</div>
<script>
(function () {
  'use strict';
  var boardEl = document.getElementById('board');
  var warningsEl = document.getElementById('warnings');
  var metaEl = document.getElementById('meta');
  var statusEl = document.getElementById('status');
  var backdrop = document.getElementById('popup-backdrop');
  var popupTitle = document.getElementById('popup-title');
  var popupBody = document.getElementById('popup-body');
  var columnIds = ['backlog', 'sprint', 'development', 'staging', 'production', 'abandoned'];
  var popupCard = null;

  // __KANVAS_MD_RENDERER_START__
  // Synchronous pure Markdown subset renderer (string in, HTML string out).
  // Covers headings, emphasis, inline code, fenced code blocks, links, unordered
  // and ordered lists, and paragraphs. HTML-escapes input before formatting; link
  // URLs pass a scheme allowlist. Self-contained (own escaper) so tests can extract
  // this block between the markers and evaluate it without a DOM.
  function renderMarkdown(src) {
    var text = String(src === null || src === undefined ? '' : src).replace(/\r\n?/g, '\n');
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function isSafeUrl(url) {
      var scheme = String(url).match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);
      if (!scheme) return true;
      var name = scheme[1].toLowerCase();
      return name === 'http' || name === 'https' || name === 'mailto';
    }
    var fences = [];
    text = text.replace(/```([^\n]*)\n([\s\S]*?)(?:```|\$)/g, function (m, lang, code) {
      fences.push({ lang: String(lang).trim(), code: String(code).replace(/\n$/, '') });
      return '\n\x00F' + (fences.length - 1) + '\x00\n';
    });
    var spans = [];
    text = text.replace(/`([^`\n]+)`/g, function (m, code) {
      spans.push(String(code));
      return '\x00C' + (spans.length - 1) + '\x00';
    });
    text = escapeHtml(text);
    function inline(s) {
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
        if (!isSafeUrl(url)) return label;
        return '<a href="' + url + '">' + label + '</a>';
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/\x00C(\d+)\x00/g, function (m, i) {
        return '<code>' + escapeHtml(spans[Number(i)]) + '</code>';
      });
      return s;
    }
    var html = [];
    var list = null;
    function closeList() {
      if (list) { html.push(list === 'ul' ? '</ul>' : '</ol>'); list = null; }
    }
    var lines = text.split('\n');
    var para = [];
    function flushPara() {
      if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
    }
    lines.forEach(function (line) {
      var fence = line.match(/^\x00F(\d+)\x00$/);
      if (fence) {
        flushPara(); closeList();
        var f = fences[Number(fence[1])];
        var cls = f.lang ? ' class="language-' + escapeHtml(f.lang) + '"' : '';
        html.push('<pre><code' + cls + '>' + escapeHtml(f.code) + '</code></pre>');
        return;
      }
      var heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        flushPara(); closeList();
        var level = heading[1].length;
        html.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>');
        return;
      }
      var ul = line.match(/^(?:-|\*)\s+(.*)$/);
      if (ul) {
        flushPara();
        if (list !== 'ul') { closeList(); html.push('<ul>'); list = 'ul'; }
        html.push('<li>' + inline(ul[1]) + '</li>');
        return;
      }
      var ol = line.match(/^\d+\.\s+(.*)$/);
      if (ol) {
        flushPara();
        if (list !== 'ol') { closeList(); html.push('<ol>'); list = 'ol'; }
        html.push('<li>' + inline(ol[1]) + '</li>');
        return;
      }
      if (/^\s*$/.test(line)) { flushPara(); closeList(); return; }
      para.push(line.trim());
    });
    flushPara(); closeList();
    return html.join('\n');
  }
  // __KANVAS_MD_RENDERER_END__
  if (typeof window !== 'undefined') { window.__kanvasRenderMarkdown = renderMarkdown; }

  function esc(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function row(term, value) {
    return '<dt>' + esc(term) + '</dt><dd>' + value + '</dd>';
  }

  function linkList(links) {
    if (!links) return esc('none');
    var parts = [];
    if (links.spec) parts.push('spec: ' + esc(links.spec));
    if (links.plan) parts.push('plan: ' + esc(links.plan));
    if (links.index) parts.push('index: ' + esc(links.index));
    return parts.length ? parts.join('<br>') : esc('none');
  }

  function specSection() {
    return '<div class="spec-row">' +
      '<button id="spec-toggle" type="button" aria-expanded="false" aria-controls="spec-view">Show spec</button>' +
      '<div id="spec-view" hidden></div>' +
      '</div>';
  }

  function fetchSpec(slug) {
    var view = document.getElementById('spec-view');
    view.hidden = false;
    view.textContent = 'Loading spec\u2026';
    fetch('api/spec?slug=' + encodeURIComponent(slug)).then(function (res) {
      return res.json().then(function (payload) { return { status: res.status, payload: payload }; });
    }).then(function (result) {
      var viewNow = document.getElementById('spec-view');
      if (!viewNow) return;
      if (result.status >= 200 && result.status < 300 && result.payload && result.payload.markdown !== undefined) {
        viewNow.innerHTML = renderMarkdown(result.payload.markdown);
        return;
      }
      var err = (result.payload && result.payload.error) || {};
      viewNow.innerHTML = '<p id="spec-error">Spec unavailable: ' + esc(err.message || err.code || 'unknown error') + '</p>';
    }).catch(function () {
      var viewNow = document.getElementById('spec-view');
      if (viewNow) viewNow.innerHTML = '<p id="spec-error">Spec unavailable: network error</p>';
    });
  }

  function moveForm(card) {
    var opts = columnIds.map(function (id) {
      return '<option value="' + esc(id) + '">' + esc(id) + '</option>';
    }).join('');
    return '<div class="move-row">' +
      '<label for="move-target">Move to</label>' +
      '<select id="move-target">' + opts + '</select>' +
      '<button id="move-confirm" type="button">Confirm move</button>' +
      '</div>';
  }

  function openPopup(card) {
    popupCard = card;
    popupTitle.textContent = card.title || card.slug;
    popupBody.innerHTML = '<dl>' +
      row('Slug', esc(card.slug)) +
      row('Column', esc(card.column)) +
      row('Index status', esc(card.indexStatus)) +
      row('Phase', esc(card.phase === null ? 'none' : card.phase)) +
      row('AC count', esc(card.acCount)) +
      row('Plan step', esc(card.planStep === null ? 'none' : card.planStep)) +
      row('Plan status', esc(card.planStatus === null ? 'none' : card.planStatus)) +
      row('Evidence', esc(card.evidence === null ? 'none' : card.evidence)) +
      row('Links', linkList(card.links)) +
      '</dl>' + moveForm(card) + specSection();
    var sel = document.getElementById('move-target');
    if (sel) sel.value = card.column;
    var btn = document.getElementById('move-confirm');
    if (btn) btn.addEventListener('click', function () {
      var target = document.getElementById('move-target').value;
      postMove(card.slug, target);
    });
    var specToggle = document.getElementById('spec-toggle');
    if (specToggle) specToggle.addEventListener('click', function () {
      var view = document.getElementById('spec-view');
      var expanded = specToggle.getAttribute('aria-expanded') === 'true';
      if (expanded) {
        view.hidden = true;
        view.innerHTML = '';
        specToggle.setAttribute('aria-expanded', 'false');
        specToggle.textContent = 'Show spec';
      } else {
        specToggle.setAttribute('aria-expanded', 'true');
        specToggle.textContent = 'Hide spec';
        fetchSpec(card.slug);
      }
    });
    backdrop.classList.add('open');
    document.getElementById('popup-close').focus();
  }

  function openNotFound(slug) {
    popupCard = null;
    popupTitle.textContent = 'Card not found';
    popupBody.innerHTML = '<p id="error">No board card exists for slug "' + esc(slug) + '".</p>';
    backdrop.classList.add('open');
    document.getElementById('popup-close').focus();
  }

  function closePopup() {
    backdrop.classList.remove('open');
    popupCard = null;
  }

  function announce(msg) {
    statusEl.textContent = msg;
  }

  function postMove(slug, toColumn) {
    announce('Moving ' + slug + ' to ' + toColumn + '…');
    fetch('api/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: slug, toColumn: toColumn }),
    }).then(function (res) {
      return res.json().then(function (payload) { return { status: res.status, payload: payload }; });
    }).then(function (result) {
      if (result.status >= 200 && result.status < 300 && result.payload.card) {
        var note = result.payload.notice ? ' ' + result.payload.notice : '';
        announce('Moved ' + slug + ' to ' + result.payload.card.column + '.' + note);
        closePopup();
        fetchBoard();
        return;
      }
      var err = result.payload.error || {};
      announce('Move failed: ' + (err.message || err.reason || 'unknown error'));
    }).catch(function () {
      announce('Move failed: network error');
    });
  }

  function render(board) {
    warningsEl.innerHTML = '';
    (board.warnings || []).forEach(function (w) {
      var div = document.createElement('div');
      div.className = 'banner';
      div.textContent = 'Warning (' + w.code + '): ' + w.detail;
      warningsEl.appendChild(div);
    });
    boardEl.innerHTML = '';
    var byColumn = {};
    (board.cards || []).forEach(function (card) {
      (byColumn[card.column] = byColumn[card.column] || []).push(card);
    });
    (board.columns || []).forEach(function (col) {
      var section = document.createElement('section');
      section.className = 'column';
      section.dataset.columnId = col.id;
      var h = document.createElement('h2');
      h.textContent = col.title + ' (' + col.count + ')';
      section.appendChild(h);
      section.addEventListener('dragover', function (ev) {
        ev.preventDefault();
        section.classList.add('drop-target');
      });
      section.addEventListener('dragleave', function () {
        section.classList.remove('drop-target');
      });
      section.addEventListener('drop', function (ev) {
        ev.preventDefault();
        section.classList.remove('drop-target');
        var slug = ev.dataTransfer.getData('text/plain');
        if (slug) postMove(slug, col.id);
      });
      (byColumn[col.id] || []).forEach(function (card) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.draggable = true;
        btn.dataset.slug = card.slug;
        btn.innerHTML = '<div></div><div class="slug"></div>';
        btn.firstChild.textContent = card.title;
        btn.lastChild.textContent = card.slug;
        btn.addEventListener('click', function () { fetchCard(card.slug); });
        btn.addEventListener('dragstart', function (ev) {
          ev.dataTransfer.setData('text/plain', card.slug);
          ev.dataTransfer.effectAllowed = 'move';
        });
        section.appendChild(btn);
      });
      boardEl.appendChild(section);
    });
    metaEl.textContent = (board.cards || []).length + ' specs';
  }

  function fetchBoard() {
    fetch('api/board').then(function (res) { return res.json(); }).then(render).catch(function () {
      warningsEl.innerHTML = '<div class="banner">Warning (board-unreachable): the board endpoint did not respond.</div>';
    });
  }

  function fetchCard(slug) {
    fetch('api/card?slug=' + encodeURIComponent(slug)).then(function (res) {
      return res.json().then(function (payload) { return { status: res.status, payload: payload }; });
    }).then(function (result) {
      if (result.payload && result.payload.card) openPopup(result.payload.card);
      else openNotFound(slug);
    }).catch(function () { openNotFound(slug); });
  }

  document.getElementById('refresh').addEventListener('click', fetchBoard);
  document.getElementById('popup-close').addEventListener('click', closePopup);
  backdrop.addEventListener('click', function (ev) { if (ev.target === backdrop) closePopup(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closePopup(); });
  fetchBoard();
})();
</script>
</body>
</html>
