# Workflow Skills Workflow Plan And Execute Feature

## Action

Follow the plan-and-execute-feature workflow:
1. Create step-00-<feature>.issue.json and step-00-<feature>.spec.md
2. Write step-01-<feature>.plan.md and optionally further refined plan files
3. Add execution and report files (e.g., exec.dag.json, plan.exec.md, plan.report.md, testing.report.md)
4. Add review and result files (review.md, result.md)
5. Update state.md to reflect current progress

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: .agents/plans/*/step-00-*.issue.json, .agents/plans/*/step-00-*.spec.md, .agents/plans/*/step-01-*.plan.md

